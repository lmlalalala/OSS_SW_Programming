name: Week8 Workflow Optimization

on:
  push:
    branches: [main, feature/week8-workflow-optimization]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci: ${{ steps.detect.outputs.ci }}
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed files
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          git diff --name-only -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/week8-changed"
          python - <<'PY'
          import os
          from pathlib import Path
          files = Path(os.environ["RUNNER_TEMP"], "week8-changed").read_bytes().decode().split("\0")
          infrastructure = lambda p: (p.startswith(".github/workflows/week8-") or
                                      p.startswith(".github/actions/setup-week8-python/"))
          deploy = any(p.startswith(("scripts/", "dashboard/")) or
                       p == "week7/package_demo.py" or infrastructure(p) for p in files)
          ci = deploy or any(p.startswith("week7/") for p in files)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ci={str(ci).lower()}\ndeploy={str(deploy).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Changed files: {sum(bool(p) for p in files)}\n\nCI needed: {ci}; deployment-related changes: {deploy}\n")
          PY

  build:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-week8-python
        with:
          python-version: '3.12'
          install-lint: 'true'
          cache-enabled: 'true'
      - name: Lint existing scripts and week7 code
        run: python -m ruff check --config week7/ruff.toml scripts week7
      - name: Build source archive
        run: python week7/package_demo.py build --output dist/dora-source.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: week8-source
          path: dist/dora-source.zip
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    uses: ./.github/workflows/week8-reusable-test.yml
    with:
      artifact-name: week8-source

  deploy:
    name: Deploy (demo ZIP only)
    needs: [changes, test]
    # PR에서는 검사만 실행한다. 지정 브랜치 push와 관련 파일 변경에만 데모 생성.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/week8-workflow-optimization') &&
      needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-week8-python
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: week8-source
          path: dist
      - name: Extract the tested code
        run: python -m zipfile -e dist/dora-source.zip package
      - name: Collect actual Actions data using a scoped secret
        working-directory: package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/calculate_dora.py
      - name: Generate report
        working-directory: package
        run: python scripts/generate_weekly_report.py
      - name: Package demo outputs (no server deployment)
        run: python week7/package_demo.py demo --root package --output dist/dora-demo.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: week8-demo-package
          path: dist/dora-demo.zip
          if-no-files-found: error
          retention-days: 7
      - name: Describe delivery scope
        run: echo "Demo ZIP artifact created. No server, Pages, or release was deployed." >> "$GITHUB_STEP_SUMMARY"
