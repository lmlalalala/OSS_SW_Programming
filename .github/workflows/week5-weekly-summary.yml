
name: Week5 Weekly Summary

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish summary to Discussions'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '17 0 * * 1'

permissions:
  contents: read
  issues: read
  pull-requests: read
  discussions: write

concurrency:
  group: week5-weekly-summary
  cancel-in-progress: false

jobs:
  weekly-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Generate weekly summary
        uses: actions/github-script@v9
        with:
          retries: 2
          script: |
            const { owner, repo } = context.repo;
            const hour = 3600000;
            const day = 24 * hour;
            const kst = 9 * hour;

            // 지난주 월요일~일요일 (한국 시간)
            const localNow = new Date(Date.now() + kst);
            const weekday = (localNow.getUTCDay() + 6) % 7;
            const thisMonday = Date.UTC(
              localNow.getUTCFullYear(),
              localNow.getUTCMonth(),
              localNow.getUTCDate() - weekday
            );

            const end = thisMonday - kst;
            const start = end - 7 * day;

            const inWeek = value => {
              if (!value) return false;
              const t = Date.parse(value);
              return t >= start && t < end;
            };

            const dateKST = value =>
              new Date(value + kst).toISOString().slice(0, 10);

            const period =
              `${dateKST(start)} ~ ${dateKST(end - 1)}`;

            // Issues 조회 (Pull Request 제외)
            const items = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner, repo,
                state: 'all',
                since: new Date(start).toISOString(),
                per_page: 100
              }
            );

            const issues = items.filter(i => !i.pull_request);
            const opened = issues.filter(i => inWeek(i.created_at));
            const closed = issues.filter(i => inWeek(i.closed_at));

            // 병합된 Pull Request 조회
            const pulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner, repo,
                state: 'closed',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              }
            );

            const merged = pulls.filter(p =>
              inWeek(p.merged_at)
            );

            // Discussions 및 카테고리 조회
            const result = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  id
                  discussionCategories(first: 30) {
                    nodes { id name }
                  }
                  discussions(
                    first: 100
                    orderBy: {
                      field: CREATED_AT
                      direction: DESC
                    }
                  ) {
                    nodes { title createdAt }
                  }
                }
              }
            `, { owner, repo });

            const data = result.repository;
            const category = data.discussionCategories.nodes
              .find(c => c.name === 'General');

            if (!category) {
              throw new Error('General category not found');
            }

            const title = `[Weekly Summary] ${period}`;

            const newDiscussions = data.discussions.nodes
              .filter(d => inWeek(d.createdAt))
              .filter(d => !d.title.startsWith('[Weekly Summary]'));

            const body = [
              '# OSS_SW_Programming Weekly Summary',
              '',
              `**기간:** ${period} (KST)`,
              '',
              '## 이번 주 활동',
              `- 새로 등록된 Issue: ${opened.length}건`,
              `- 종료된 Issue: ${closed.length}건`,
              `- 병합된 PR: ${merged.length}건`,
              `- 새로 등록된 Discussion: ${newDiscussions.length}건`,
              '',
              '## DORA 메트릭',
              'DORA 4대 지표는 기존 Week2 워크플로우에서 별도 수집합니다.',
              '본 요약에는 아직 DORA 실제 수치가 연동되지 않았습니다.',
              '',
              '## 참고 링크',
              `- [Repository](https://github.com/${owner}/${repo})`,
              `- [Project Wiki](https://github.com/${owner}/${repo}/wiki)`,
              `- [RFC-001](https://github.com/${owner}/${repo}/discussions/21)`,
              '',
              '---',
              'Generated by GitHub Actions.'
            ].join('\n');

            // Actions 화면에도 결과 출력
            core.summary.addHeading(title);
            core.summary.addRaw(body);
            await core.summary.write();

            // 수동 실행은 기본적으로 미리보기만 수행
            const publish =
              context.eventName === 'schedule' ||
              String(context.payload.inputs?.publish) === 'true';

            if (!publish) {
              core.info('Preview only. No discussion created.');
              return;
            }

            // 중복 게시 방지
            const exists = data.discussions.nodes
              .some(d => d.title === title);

            if (exists) {
              core.info('Weekly summary already exists.');
              return;
            }

            // Discussions 게시
            const created = await github.graphql(`
              mutation($input: CreateDiscussionInput!) {
                createDiscussion(input: $input) {
                  discussion { url }
                }
              }
            `, {
              input: {
                repositoryId: data.id,
                categoryId: category.id,
                title,
                body
              }
            });

            core.info(
              `Published: ${created.createDiscussion.discussion.url}`
            );
