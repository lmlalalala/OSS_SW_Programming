name: Set up Week8 Python
description: Prepare Python and optionally install the pinned lint tool.
inputs:
  python-version:
    description: Python version to use
    required: true
  install-lint:
    description: Install the lint requirements for the build job
    default: 'false'
  cache-enabled:
    description: Restore and save pip downloads when installing lint requirements
    default: 'false'
  cache-scope:
    description: Cache namespace (benchmark uses a unique run namespace)
    default: dependencies
outputs:
  cache-hit:
    description: Whether the exact pip cache key was restored
    value: ${{ steps.pip-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Restore pip cache
      id: pip-cache
      if: inputs.install-lint == 'true' && inputs.cache-enabled == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/week8-pip
        key: week8-${{ inputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-${{ hashFiles('week7/requirements-ci.txt') }}
    - name: Install lint tool
      if: inputs.install-lint == 'true'
      shell: bash
      env:
        PIP_CACHE_DIR: ${{ runner.temp }}/week8-pip
        CACHE_ENABLED: ${{ inputs.cache-enabled }}
      run: |
        if [ "$CACHE_ENABLED" = "true" ]; then
          python -m pip install -r week7/requirements-ci.txt
        else
          python -m pip install --no-cache-dir -r week7/requirements-ci.txt
        fi
