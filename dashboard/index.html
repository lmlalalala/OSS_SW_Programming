<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DORA Metrics Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f7fa;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .chart-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>DORA Metrics Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Lead Time</h3>
            <div id="leadTime" class="value">-</div>
        </div>

        <div class="card">
            <h3>Deployment Frequency</h3>
            <div id="deploymentFrequency" class="value">-</div>
        </div>

        <div class="card">
            <h3>MTTR</h3>
            <div id="mttr" class="value">-</div>
        </div>

        <div class="card">
            <h3>Change Failure Rate</h3>
            <div id="failureRate" class="value">-</div>
        </div>

    </div>

    <div class="chart-box">
        <canvas id="doraChart"></canvas>
    </div>

</div>

<script>

fetch('../dora-metrics.json')
    .then(response => response.json())
    .then(data => {

        document.getElementById('leadTime').innerText =
            data.lead_time_minutes + ' min';

        document.getElementById('deploymentFrequency').innerText =
            data.deployment_frequency;

        document.getElementById('mttr').innerText =
            data.mttr_minutes + ' min';

        document.getElementById('failureRate').innerText =
            data.change_failure_rate + '%';


        const ctx = document.getElementById('doraChart');

        new Chart(ctx, {
            type: 'bar',

            data: {
                labels: [
                    'Lead Time',
                    'Deployment Frequency',
                    'MTTR',
                    'Change Failure Rate'
                ],

                datasets: [{
                    label: 'DORA Metrics',
                    data: [
                        data.lead_time_minutes,
                        data.deployment_frequency,
                        data.mttr_minutes,
                        data.change_failure_rate
                    ]
                }]
            },

            options: {
                responsive: true,

                plugins: {
                    title: {
                        display: true,
                        text: 'DORA 4대 지표'
                    }
                },

                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

    })
    .catch(error => {
        console.error('데이터 로딩 실패:', error);
    });

</script>

</body>
</html>
